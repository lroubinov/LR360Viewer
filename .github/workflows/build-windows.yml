name: Build Windows Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      ZIP_NAME: LR360Viewer-${{ github.ref_name }}-Windows.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install build dependencies
        run: pip install -r requirements-build.txt

      - name: Build EXE
        run: pyinstaller --clean --noconfirm LR360Viewer.spec

      - name: Put EXE inside Lightroom plug-in
        shell: pwsh
        run: Copy-Item "dist\\LR360Viewer.exe" "LR360Viewer.lrplugin\\viewer\\LR360Viewer.exe"

      - name: Remove developer-only setup helper
        shell: pwsh
        run: Remove-Item "LR360Viewer.lrplugin\\viewer\\Install-WebView2.cmd" -ErrorAction SilentlyContinue

      - name: Create Windows release ZIP
        shell: pwsh
        run: Compress-Archive -Path "LR360Viewer.lrplugin" -DestinationPath $env:ZIP_NAME -Force

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: LR360Viewer-${{ github.ref_name }}-Windows
          path: ${{ env.ZIP_NAME }}

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $env:RELEASE_TAG already exists. Create a new version tag instead of overwriting it."
          }
          gh release create $env:RELEASE_TAG $env:ZIP_NAME `
            --title "LR 360 Viewer $env:RELEASE_TAG" `
            --generate-notes
